name: Deploy
on: { workflow_dispatch: {} }
concurrency: { group: production, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    # The deploy targets and health-check URL below belong to this repository's
    # Cloudflare account; forks must configure their own before enabling deploys.
    if: github.repository == 'itsajaygaur/kivo'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm build
      - run: pnpm exec wrangler d1 migrations apply kivo-db --remote --config apps/web/wrangler.jsonc
        env:
          {
            CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
          }
      - run: pnpm exec wrangler deploy -c apps/ai-worker/wrangler.jsonc
        env:
          {
            CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
          }
      - run: pnpm --filter @kivo/web run deploy
        env:
          {
            CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
          }
      - run: curl --fail --retry 5 https://kivo-web.ajaypathak2527.workers.dev/api/v1/health
